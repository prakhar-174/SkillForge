<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>SkillForge | AI-Powered Student Upskilling & Verified Hiring Platform</title>
  <meta name="title" content="SkillForge | AI-Powered Student Upskilling & Verified Hiring Platform" />
  <meta name="description" content="SkillForge bridges the gap between student learning and startup hiring through AI-verified skill assessments, dynamic Skill CIBIL scores, and direct interview matching. Transform into the top 1% of talent." />
  <meta name="keywords" content="SkillForge, upskilling, verified developer, tech hiring, skill score, Skill CIBIL, AI assessment, react, python, startup jobs, internship, candidate proctoring" />
  <meta name="author" content="SkillForge Team" />
  <meta name="robots" content="index, follow" />

  <!-- Theme Color for Browser Header -->
  <meta name="theme-color" content="#FDF8F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://skillforge.io/" />
  <meta property="og:site_name" content="SkillForge" />
  <meta property="og:title" content="SkillForge | AI-Powered Student Upskilling & Verified Hiring Platform" />
  <meta property="og:description" content="Bridge the gap between learning and earning with AI-verified assessments, dynamic Skill CIBIL scoring, and direct startup job matching." />
  <meta property="og:image" content="/favicon.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://skillforge.io/" />
  <meta name="twitter:title" content="SkillForge | AI-Powered Student Upskilling & Verified Hiring Platform" />
  <meta name="twitter:description" content="Transform into the top 1% of tech talent. AI-evaluated skills, dynamic scoring, and verified hiring pipelines." />
  <meta name="twitter:image" content="/favicon.svg" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme-storage');
        if (stored) {
          var parsed = JSON.parse(stored);
          if (parsed && parsed.state && parsed.state.theme === 'dark') {
            document.documentElement.classList.add('dark');
            return;
          }
        }
      } catch (e) { }
      document.documentElement.classList.remove('dark');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
